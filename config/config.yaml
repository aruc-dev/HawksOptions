# HawksOptions configuration

mode: paper
secrets_source: local

account:
  options_level: 3
  pdt_threshold_usd: 25000
  max_portfolio_risk_pct: 0.20
  max_single_position_risk_pct: 0.05
  max_open_strategies: 8
  reserve_cash_pct: 0.15
  daily_loss_halt_pct: 0.05
  tail_risk_close_pct: 0.08
  max_rolls_per_strategy_id: 2

gates:
  min_dte_entry: 7
  max_dte_entry: 55
  min_open_interest: 100
  min_daily_volume: 10
  max_bid_ask_spread_pct: 0.10
  earnings_blackout_days_before: 5
  close_positions_days_before_earnings: 2
  min_iv_rank_for_short_premium: 30
  max_iv_rank_for_long_premium: 40
  vix_iv_rank_scaling:
    enabled: false
    low_vix_below: 15
    low_vix_min_iv_rank_for_short_premium: 50
    high_vix_above: 25
    high_vix_min_iv_rank_for_short_premium: 35
    # Required when market_data.vix_symbol_scale is "proxy"; proxy ETF prices
    # are not on the same scale as the VIX index.
    proxy_low_below:
    proxy_high_above:
  # Calendar spreads: flag for close when the front short leg's mid
  # falls within this many dollars per share of intrinsic value
  # (early-assignment risk).
  calendar_assignment_slippage: 0.05

portfolio_beta_limits:
  enabled: false
  # Optional SPY-beta-weighted dollar-delta ceiling. For example, 0.50
  # caps projected beta-weighted delta at 50% of account equity when enabled.
  max_abs_spy_beta_delta_pct: 0.50
  symbol_betas: {}

risk_actions:
  # Continuous risk checks always produce close-order plans for actionable
  # exits. Actual broker submission remains disabled unless explicitly enabled.
  execute_closes: false

underlyings:
  source: config/underlyings.yaml
  refresh_earnings_dates_days: 7

market_data:
  # Paper EC2 should scan Alpaca market data. Set this to true only in
  # config.local.yaml for local deterministic tests or sample dry-runs.
  use_sample_data: false
  option_chain_strike_window_pct: 0.20
  option_bar_batch_size: 200
  # Algo Trader Plus enables realtime OPRA options data. Override to
  # "indicative" only in config.local.yaml for testing/debug accounts without
  # realtime OPRA access; indicative should not drive live trading decisions.
  option_feed: opra
  # Tradable Alpaca stock/ETF proxy used for the optional VIX-aware
  # IV-rank scaling gate when sample data is disabled. Override this
  # if your data provider exposes a different volatility proxy.
  vix_symbol: VIXY
  vix_symbol_scale: proxy
  risk_free_rate: 0.045
  default_dividend_yield: 0.0

backtest:
  data_source: sample
  # Slippage and commission applied per leg on both entry and exit.
  # Repo defaults include realistic slippage/commission, so baseline
  # backtest results include transaction-cost drag.
  slippage:
    per_leg_cents: 0.02            # $/share per leg ($2 per contract)
    spread_pct: 0.50               # fraction of half-spread paid per leg
    commission_per_contract: 0.65  # flat $/contract commission

strategies:
  cash_secured_put:
    enabled: false
    required_options_level: 1
    swing_only: true
    target_delta: -0.20
    target_dte: 35
    target_dte_min: 25
    target_dte_max: 45
    profit_take_pct: 0.50
    loss_stop_multiple: 2.0
    roll_threshold_delta: -0.40
    max_contracts_per_underlying: 1
    weight: 1.0

  covered_call:
    enabled: false
    required_options_level: 1
    swing_only: true
    target_delta: 0.25
    target_dte: 35
    target_dte_min: 25
    target_dte_max: 45
    profit_take_pct: 0.50
    loss_stop_multiple: 2.0
    roll_threshold_delta: 0.45
    close_before_ex_div_if_itm: true
    weight: 1.0

  vertical_spread:
    enabled: true
    required_options_level: 3
    swing_only: true
    variant: bull_put_credit
    short_delta: -0.25
    long_delta: -0.10
    target_dte: 35
    target_dte_min: 25
    target_dte_max: 45
    profit_take_pct: 0.50
    loss_stop_multiple: 1.5
    roll_threshold_delta: -0.40
    min_credit_to_width: 0.05
    min_net_credit: 5.0
    min_iv_realized_spread: 0.0
    min_tail_skew: 0.0
    weight: 1.0

  iron_condor:
    enabled: true
    required_options_level: 3
    swing_only: true
    put_short_delta: -0.18
    put_long_delta: -0.08
    call_short_delta: 0.18
    call_long_delta: 0.08
    target_dte: 40
    target_dte_min: 30
    target_dte_max: 50
    profit_take_pct: 0.40
    loss_stop_multiple: 2.0
    warning_delta_abs: 0.40
    min_iv_rank: 30
    min_iv_over_realized_vol: 1.0
    min_iv_realized_spread: 0.0
    min_tail_skew: 0.0
    max_atr_pct: 0.03
    min_credit_to_width: 0.30
    min_net_credit: 5.0
    # Require gross credit to clear modeled entry + exit costs. The sample
    # replay showed low-credit condors were dominated by friction.
    min_credit_to_roundtrip_cost: 1.25
    skip_if_earnings_within_dte: true
    weight: 1.0

  broken_wing_butterfly:
    enabled: false
    required_options_level: 3
    swing_only: true
    option_type: put
    body_delta: -0.25
    target_dte: 35
    target_dte_min: 25
    target_dte_max: 45
    min_wing_width: 1.0
    broken_wing_ratio: 2.0
    profit_take_pct: 0.35
    loss_stop_multiple: 1.5
    roll_threshold_delta: 0.45
    min_credit_to_width: 0.02
    min_net_credit: 1.0
    min_iv_realized_spread: 0.0
    min_tail_skew: 0.0
    contracts: 1
    weight: 0.4

  butterfly:
    enabled: false
    required_options_level: 3
    swing_only: true
    variant: long_debit
    option_type: put
    body_delta: -0.25
    target_dte: 35
    target_dte_min: 25
    target_dte_max: 45
    min_wing_width: 1.0
    max_wing_width_mismatch: 0.0
    profit_take_pct: 0.50
    loss_stop_multiple: 1.0
    roll_threshold_delta: 0.45
    min_credit_to_width: 0.02
    min_net_credit: 1.0
    min_iv_realized_spread: 0.0
    min_tail_skew: 0.0
    contracts: 1
    weight: 0.3

  collar:
    enabled: false
    required_options_level: 1
    swing_only: true
    put_delta: -0.20
    call_delta: 0.20
    target_dte: 35
    target_dte_min: 25
    target_dte_max: 45
    profit_take_pct: 0.50
    loss_stop_multiple: 1.0
    roll_threshold_delta: 0.45
    contracts: 1
    weight: 0.4

  calendar_spread:
    enabled: false
    required_options_level: 3
    swing_only: true
    target_delta: 0.30
    front_dte: 21
    back_dte: 45
    contracts: 1
    weight: 0.5

  diagonal_spread:
    enabled: false
    required_options_level: 3
    swing_only: true
    variant: call_debit
    front_delta: 0.30
    back_delta: 0.45
    front_dte: 21
    back_dte: 45
    target_dte_min: 14
    target_dte_max: 75
    profit_take_pct: 0.30
    loss_stop_multiple: 1.0
    profit_multiple_estimate: 1.5
    contracts: 1
    weight: 0.4

  tail_risk_hedge:
    enabled: false
    required_options_level: 1
    swing_only: true
    target_delta: -0.10
    target_dte: 45
    target_dte_min: 30
    target_dte_max: 55
    min_drawdown_pct: 0.05
    min_daily_loss_pct: 0.03
    min_atr_pct: 0.025
    min_iv_over_realized_vol: 1.25
    premium_budget_pct: 0.01
    profit_take_pct: 1.0
    loss_stop_multiple: 1.0
    contracts: 1
    weight: 0.2

  earnings_iron_condor:
    enabled: false
    required_options_level: 3
    swing_only: true
    require_iv_rank: 60
    entry_days_before_earnings: 1
    put_short_delta: -0.16
    put_long_delta: -0.08
    call_short_delta: 0.16
    call_long_delta: 0.08
    dte_min: 7
    dte_max: 14
    profit_take_pct: 0.25
    loss_stop_multiple: 1.25
    warning_delta_abs: 0.35
    min_credit_to_width: 0.05
    min_net_credit: 5.0
    max_contracts: 1
    weight: 0.3

ai:
  enabled: false
  provider: openai
  daily_spend_cap_usd: 5.0
  news_gate:
    enabled: true
    veto_threshold: 0.7
  earnings_sentiment:
    enabled: false
  trade_idea_critic:
    enabled: true
    veto_on: major_concern

research:
  earnings_calendar_spread:
    enabled: false
    min_days_to_earnings: 1
    max_days_to_earnings: 10
    min_earnings_confidence: 0.8
    min_iv_rank: 50
    min_front_back_iv_spread: 0.03
    option_types:
      - call
      - put
    front_min_dte: 7
    front_max_dte: 21
    back_target_dte: 45
    back_max_dte: 55
    max_debit: 250.0
    max_assignment_intrinsic_slippage: 0.05
    exit_days_after_earnings: 1
    max_candidates_per_underlying: 5
  volatility_crush_earnings_iron_condor:
    enabled: false
    min_days_to_earnings: 0
    max_days_to_earnings: 3
    min_iv_rank: 70
    dte_min: 7
    dte_max: 21
    target_dte: 14
    put_short_delta: -0.16
    put_long_delta: -0.08
    call_short_delta: 0.16
    call_long_delta: 0.08
    require_short_strikes_outside_expected_move: true
    min_credit: 50.0
    max_loss: 500.0
    max_event_risk_pct: 0.01
    exit_days_after_earnings: 1

schedule:
  scan_interval_min: 30
  risk_check_interval_min: 5
  elevated_risk_check_interval_min: 1
  roll_check_interval_min: 60
  eod_report_time: "16:45"
  expiration_exit_cutoff_time: "15:15"

reporting:
  trade_log_file: data/trades.csv
  positions_file: data/positions.json
  greeks_snapshot_dir: data/greeks_snapshots
  iv_history_file: data/iv_rank_history.csv
  reports_dir: reports
  logs_dir: logs
